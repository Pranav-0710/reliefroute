spec_version: 1
name: reliefroute
version: 0.1.0
type: space
runtime: fastapi
app: server.app:app
port: 8000
validation:
  reward:
    # per-step simulator reward with the default 5 requests: urgency-weighted deliveries
    # minus delays, blocked legs and (on the last step) unmet needs
    range: [-300.0, 250.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 1.0
    memory_mb: 512
    disk_mb: 256
    episode_timeout_s: 30.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [logistics, disaster-relief, routing, multi-step]
