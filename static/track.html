<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="robots" content="noindex">
<title>ReliefRoute request status</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111315'/><path d='M8 23 L15 14 L24 9' stroke='%235fb37f' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='24' cy='9' r='3.2' fill='%23e3a33b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --card:#ffffff; --line:#d9d6cf; --text:#17191c; --muted:#5b6068;
          --ok:#1f7a4d; --warn:#9a5b00; --bad:#b42318; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { touch-action:manipulation; }
  button, a, label.tile, summary { -webkit-tap-highlight-color:transparent; transition:background-color .15s ease-out, border-color .15s ease-out, transform .1s ease-out; }
  button:active:not(:disabled), a:active, label.tile:active { transform:scale(.98); }
  @media (prefers-reduced-motion:reduce) { button:active, a:active, label.tile:active { transform:none; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 "IBM Plex Sans", system-ui, sans-serif;
         padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .card.delivered { border-color:var(--ok); } .card.en_route { border-color:var(--text); } .card.bad { border-color:var(--bad); }
  .card h2 { font-size:18px; margin:0 0 4px; }
  .steps { list-style:none; margin:12px 0 0; padding:0; }
  .steps li { position:relative; padding:0 0 14px 30px; color:var(--muted); font-size:15px; }
  .steps li::before { content:""; position:absolute; left:0; top:3px; width:16px; height:16px; border-radius:50%; border:2px solid #8a8780; background:var(--card); z-index:1; }
  .steps li:not(:last-child)::after { content:""; position:absolute; left:8px; top:21px; bottom:0; width:2px; background:var(--line); }
  .steps li.done { color:var(--text); } .steps li.done::before { background:var(--ok); border-color:var(--ok); }
  .steps li.done:not(:last-child)::after { background:var(--ok); }
  .steps li.now { color:var(--text); font-weight:600; } .steps li.now::before { border-color:var(--text); border-width:3px; }
  .steps li.warn { color:var(--warn); } .steps li.warn::before { border-color:var(--warn); background:#fbf1df; }
  .refresh { min-height:48px; padding:0 18px; border:2px solid var(--text); background:none; border-radius:10px; font:600 15px "IBM Plex Sans", sans-serif; color:var(--text); cursor:pointer; }
  :focus-visible { outline:3px solid #0b5cad; outline-offset:2px; }
  .note { font-size:14px; color:var(--muted); margin-top:4px; }
  footer { margin-top:22px; color:var(--muted); font-size:13px; }
  footer a { color:var(--muted); }

  /* ---- mission-control theme shared with the console: dark top bar, square corners, one orange action ---- */
  :root { --bg:#f3f2ee; --card:#ffffff; --line:#d6d3cc; --line-strong:#8a8780; --text:#14171a; --muted:#565b62;
          --ok:#1d7a4c; --bad:#b42318; --signal:#ff7a1a; --signal-ink:#160b02; --ok-bg:#e8f2ec; --bad-bg:#fbebe9; }
  body { padding-top:0 !important; }
  .topbar { position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:12px; margin:0 -16px 20px; padding:0 16px;
            height:52px; background:#0a0c0f; color:#e9e7e3; }
  .topbar .mark { display:flex; align-items:center; gap:9px; font:600 13px "IBM Plex Mono", monospace; letter-spacing:.16em; }
  .topbar .mark::before { content:""; width:9px; height:9px; background:var(--signal); }
  .topbar .ctx { color:#a1a9b2; font-size:13px; padding-left:12px; border-left:1px solid #2b333d; white-space:nowrap; }
  .topbar .right { margin-left:auto; font:12px "IBM Plex Mono", monospace; color:#a1a9b2; white-space:nowrap; }
  .topbar .right[data-tone=ok] { color:#3ddc97; } .topbar .right[data-tone=warn] { color:var(--signal); }
  .topbar .right[data-tone=bad] { color:#ff5a52; } .topbar .right[data-tone=info] { color:#6ea8fe; }
  h1 { font-size:24px !important; letter-spacing:-.015em; margin-top:0 !important; }
  .card, .stop, .tile, textarea, input, button, .btn, .detail, .map, .refresh, .card a.track, .dock > div, .dock button { border-radius:2px !important; }
  .card, .stop { border-width:1px !important; }
  footer { border-top:1px solid var(--line); padding-top:14px; }

  .card.delivered { border-left:5px solid var(--ok) !important; } .card.en_route { border-left:5px solid var(--signal) !important; }
  .card.bad { border-left:5px solid var(--bad) !important; }
  .steps li.now::before { border-color:var(--signal) !important; }
</style>
</head>
<body>
<header class="topbar"><span class="mark">RELIEFROUTE</span><span class="ctx">Request status</span></header>
<main>
  <h1>Your request</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="list" aria-live="polite"></div>
  <p class="note" id="updated"></p>
  <button class="refresh" id="refresh" type="button">Check now</button>
  <footer>This page updates by itself. Bookmark it to check later. <a href="/report">Send another report</a></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOKEN = location.pathname.split("/").filter(Boolean).pop();
const clock = ts => new Date(ts * 1000).toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });

function card(i) {
  const coming = i.trips.filter(t => t.status === "pending");
  const eta = coming.length ? Math.min(...coming.map(t => t.eta_at)) : null;
  const failed = i.trips.filter(t => ["failed", "blocked", "skipped", "unreachable"].includes(t.status));
  const steps = [
    ["Received", true, clock(i.reported_at)],
    ...(failed.length && i.status !== "delivered" ? [["A truck could not get through", "warn", "your request is back in the queue for the next truck"]] : []),
    ["Truck on the way", i.assigned > 0 || i.delivered > 0, eta ? `expected around ${clock(eta)}` : ""],
    ["Delivered", i.status === "delivered", i.delivered ? `${i.delivered} of ${i.requested} ${esc(i.item)} handed over` : ""],
  ];
  const now = steps.findIndex(s => !s[1]);
  const headline = i.status === "closed" ? "Closed by the coordination desk"
    : i.status === "delivered" ? "Delivered" : i.assigned > 0 ? "Truck on the way" : "Waiting for a truck";
  return `<div class="card ${i.status === "delivered" ? "delivered" : i.assigned > 0 ? "en_route" : ""}">` +
    `<h2>${esc(i.zone)}: ${i.requested} ${esc(i.item)}</h2><div>${headline}</div>` +
    (i.status === "closed" ? `<p class="note">The desk closed this request, for example because it was resolved locally. If you still need help, send a new report.</p>`
      : `<ol class="steps">${steps.map(([t, done, d], k) =>
      `<li class="${done === "warn" ? "warn" : done ? "done" : k === now ? "now" : ""}"${k === now ? ' aria-current="step"' : ""}>${t}${d ? ` · ${d}` : ""}</li>`).join("")}</ol>`) +
    (i.reports > 1 ? `<div class="note">${i.reports} people reported this need; it is handled as one request.</div>` : "") +
    `</div>`;
}

let loaded = false;
async function load() {
  try {
    const r = await fetch(`/api/track/${TOKEN}`);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `Server error ${r.status}`);
    $("sub").textContent = `Sent ${clock(body.report.at)}` + (body.report.summary ? ` · "${body.report.summary}"` : "");
    $("list").innerHTML = body.incidents.map(card).join("") ||
      `<div class="card">No supplies were recognised in this report${body.report.hazards ? ", but the road hazard you reported is on the dispatch map" : ""}. The desk can still read your message.</div>`;
    loaded = true;
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    // weak signal: keep the last good status on screen instead of replacing it with an error
    if (loaded) { if (!$("updated").textContent.includes("retrying")) $("updated").textContent += " · no connection, retrying"; return; }
    $("sub").textContent = ""; $("list").innerHTML = `<div class="card bad"><h2>Cannot load this request</h2><p>${esc(e.message)}</p></div>`;
  }
}
$("refresh").onclick = load;
load();
setInterval(() => { if (!document.hidden) load(); }, 20000);
</script>
</body>
</html>
