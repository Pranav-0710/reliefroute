<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="robots" content="noindex">
<title>ReliefRoute driver</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111315'/><path d='M8 23 L15 14 L24 9' stroke='%235fb37f' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='24' cy='9' r='3.2' fill='%23e3a33b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Light, high-contrast theme: drivers read this in a cab, often in daylight. */
  :root { --bg:#f6f5f2; --card:#ffffff; --line:#d9d6cf; --text:#17191c; --muted:#5b6068;
          --ok:#1f7a4d; --warn:#9a5b00; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 "IBM Plex Sans", system-ui, sans-serif;
         padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .map { background:#eef0ec; border:2px solid var(--line); border-radius:10px; overflow:hidden; }
  .map svg { display:block; width:100%; height:auto; }
  .facts { display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin:8px 0 4px; }
  .facts b { color:var(--text); font-weight:600; }
  .stop { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .stop.next { border-color:var(--text); }
  .stop.delivered { border-color:var(--ok); opacity:.75; }
  .stop.failed, .stop.blocked, .stop.skipped { border-color:var(--bad); opacity:.75; }
  .stop h2 { font-size:18px; margin:0; display:flex; justify-content:space-between; gap:8px; }
  .stop h2 small { font-weight:500; color:var(--muted); font-size:14px; white-space:nowrap; }
  .stop .what { font-size:16px; margin:4px 0 2px; }
  .stop .state { font-weight:600; font-size:15px; margin-top:6px; }
  .state.delivered { color:var(--ok); } .state.failed, .state.blocked, .state.skipped { color:var(--bad); }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .acts button, .acts a { min-height:52px; border-radius:10px; font:600 16px "IBM Plex Sans", sans-serif; cursor:pointer;
                          display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .primary { grid-column:1 / -1; background:var(--ok); color:#fff; border:0; }
  .plain { background:none; border:2px solid var(--text); color:var(--text); }
  .danger { background:none; border:2px solid var(--bad); color:var(--bad); }
  .detail { grid-column:1 / -1; display:none; gap:8px; }
  .detail.open { display:grid; }
  .detail input { width:100%; min-height:48px; font:inherit; padding:8px 12px; border:2px solid var(--line); border-radius:10px; }
  .detail label { font-size:14px; color:var(--muted); }
  .card { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:14px; margin-top:14px; }
  .card.ok { border-color:var(--ok); } .card.bad { border-color:var(--bad); }
  .card h2 { font-size:17px; margin:0 0 6px; }
  footer { margin-top:22px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Driver</h1>
  <p class="sub" id="subtitle">Loading your route…</p>
  <div id="msg"></div>
  <div id="route"></div>
  <footer>Keep this page open: it refreshes by itself. Only share this link with the driver of this truck.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOKEN = location.pathname.split("/").filter(Boolean).pop();
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
let state = null, busy = false, open = null;

function show(cls, html) { $("msg").innerHTML = html ? `<div class="card ${cls}">${html}</div>` : ""; }

function mapSvg(route, depot, hazards) {
  const pts = [[depot.lat, depot.lng], ...route.shape, ...route.stops.map(s => [s.lat, s.lng])];
  let [la0, la1, lo0, lo1] = [Math.min(...pts.map(p => p[0])), Math.max(...pts.map(p => p[0])),
                              Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))];
  const pad = 0.008; la0 -= pad; la1 += pad; lo0 -= pad; lo1 += pad;
  const kx = Math.cos(13.05 * Math.PI / 180), W = 600;
  const H = Math.round(Math.max(260, Math.min(520, W * (la1 - la0) / ((lo1 - lo0) * kx))));
  const sc = Math.min(W / ((lo1 - lo0) * kx), H / (la1 - la0));
  const ox = (W - (lo1 - lo0) * kx * sc) / 2, oy = (H - (la1 - la0) * sc) / 2;
  const P = (la, lo) => [ox + (lo - lo0) * kx * sc, oy + (la1 - la) * sc];
  const kmPx = sc / 110.57;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map">`;
  for (const h of hazards) { const [x, y] = P(h.lat, h.lng); s += `<circle cx="${x}" cy="${y}" r="${h.radius_km * kmPx}" fill="#b4231822" stroke="#b42318" stroke-width="3"><title>${esc(h.label)}</title></circle>`; }
  if (route.shape.length > 1) s += `<polyline points="${route.shape.map(p => P(p[0], p[1]).join(",")).join(" ")}" fill="none" stroke="#1f7a4d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" ${route.source === "estimate" ? 'stroke-dasharray="10 7"' : ""}/>`;
  const [dx, dy] = P(depot.lat, depot.lng);
  s += `<rect x="${dx - 12}" y="${dy - 12}" width="24" height="24" fill="#17191c"/><text x="${dx + 18}" y="${dy - 14}" font-size="26" font-weight="600" fill="#17191c">${esc(depot.name)}</text>`;
  for (const st of route.stops) {
    const [x, y] = P(st.lat, st.lng), done = st.status !== "pending";
    const col = st.status === "delivered" ? "#1f7a4d" : done ? "#b42318" : "#17191c";
    s += `<circle cx="${x}" cy="${y}" r="20" fill="${done ? col : "#fff"}" stroke="${col}" stroke-width="5"/><text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="600" fill="${done ? "#fff" : "#17191c"}">${st.n}</text>`;
  }
  return s + "</svg>";
}

function render() {
  const { truck, depot, route, hazards } = state;
  $("title").textContent = `Truck ${truck.id}`;
  if (!route) {
    $("subtitle").textContent = `${depot.name} · ${truck.capacity} units · ${truck.status === "out_of_service" ? "out of service" : "waiting at depot"}`;
    $("route").innerHTML = `<div class="card"><h2>No route assigned</h2><p>When the coordinator dispatches a wave that uses this truck, your stops appear here. This page checks every 15 seconds.</p></div>`;
    return;
  }
  const next = route.stops.find(s => s.status === "pending");
  $("subtitle").innerHTML = `Route <span class="mono">${esc(route.id)}</span> from ${esc(depot.name)} · left ${clock(route.created_at)}`;
  let h = `<div class="map">${mapSvg(route, depot, hazards)}</div>`;
  h += `<div class="facts"><span><b>${route.km}</b> km</span><span>about <b>${route.minutes}</b> min driving</span>` +
       `<span>${route.source === "road" ? "Road route around reported hazards" : "Estimated route (road router unavailable)"}</span></div>`;
  for (const s of route.stops) {
    const pending = s.status === "pending", isNext = next && next.n === s.n;
    const nav = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving`;
    h += `<div class="stop ${pending ? (isNext ? "next" : "") : s.status}"><h2>Stop ${s.n} · ${esc(s.zone)}<small>${pending ? "ETA " + clock(route.created_at + s.eta_min * 60) : clock(s.at)}</small></h2>` +
         `<div class="what">Drop <b>${s.qty} ${esc(s.item)}</b></div>`;
    if (!pending) {
      const label = { delivered: `Delivered ${s.delivered_qty}`, failed: "Could not deliver", blocked: "Road blocked", skipped: "Not reached" }[s.status];
      h += `<div class="state ${s.status}">${label}${s.note ? " · " + esc(s.note) : ""}</div></div>`;
      continue;
    }
    const o = open && open.n === s.n ? open.kind : "";
    h += `<div class="acts">
      <button class="primary" data-act="delivered" data-n="${s.n}">Delivered all ${s.qty}</button>
      <button class="plain" data-open="short" data-n="${s.n}">Delivered less</button>
      <a class="plain" href="${nav}" target="_blank" rel="noopener">Navigate</a>
      <button class="danger" data-open="failed" data-n="${s.n}">Could not deliver</button>
      <button class="danger" data-open="blocked" data-n="${s.n}">Road blocked</button>
      <div class="detail ${o ? "open" : ""}">${o === "short" ? `<label for="q${s.n}">How many did you hand over?</label><input id="q${s.n}" type="number" inputmode="numeric" min="0" max="${s.qty}" value="${Math.round(s.qty / 2)}"><button class="primary" data-act="delivered" data-n="${s.n}" data-short="1">Confirm</button>`
        : o ? `<label for="w${s.n}">${o === "blocked" ? "What is blocking the road? (your GPS position is sent)" : "Why not? (camp moved, nobody there…)"}</label><input id="w${s.n}" maxlength="120"><button class="primary" data-act="${o}" data-n="${s.n}">Send</button>` : ""}</div>
    </div></div>`;
  }
  $("route").innerHTML = h;
}

async function load() {
  if (busy) return;
  try {
    const r = await fetch(`/api/driver/${TOKEN}`);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `Server error ${r.status}`);
    const changed = JSON.stringify(body) !== JSON.stringify(state);
    state = body;
    if (changed && !open) render();
  } catch (e) { if (!state) { $("subtitle").textContent = ""; show("bad", `<h2>Cannot load route</h2><p>${esc(e.message)}</p>`); } }
}

function gps() {
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lng: p.coords.longitude }), () => ok(null),
      { enableHighAccuracy: true, timeout: 8000 });
  });
}

async function act(kind, n, short) {
  const body = { outcome: kind };
  if (short) body.qty = Math.max(0, parseInt($(`q${n}`).value, 10) || 0);
  if (kind !== "delivered") body.note = ($(`w${n}`) || {}).value || "";
  if (kind === "blocked") Object.assign(body, await gps() || {});
  busy = true;
  try {
    const r = await fetch(`/api/driver/${TOKEN}/stops/${n}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.detail || `Server error ${r.status}`);
    open = null; state = { truck: out.truck, depot: out.depot, route: out.route, hazards: out.hazards }; render();
    if (out.closed) show(kind === "delivered" ? "ok" : "bad", `<h2>Route finished</h2>${kind === "blocked" ? "<p>Blocked road reported: the coordinator sees it and the next route goes around it.</p>" : ""}<p>Head back to the depot. Anything you did not hand over goes back into stock.</p>` +
      (out.learned && out.learned.eta_samples ? `<p>Your arrival times were used to correct future ETAs.</p>` : ""));
    else show(kind === "delivered" ? "ok" : "bad", `<h2>${kind === "delivered" ? "Delivery recorded" : kind === "blocked" ? "Blocked road reported" : "Failed delivery recorded"}</h2>` +
      (kind === "blocked" ? "<p>The coordinator sees it on the map, and later routes go around it.</p>" : ""));
  } catch (e) { show("bad", `<h2>Not sent</h2><p>${esc(e.message)}. Check your signal and try again.</p>`); }
  finally { busy = false; }
}

$("route").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const n = +b.dataset.n;
  if (b.dataset.open) { open = open && open.n === n && open.kind === b.dataset.open ? null : { n, kind: b.dataset.open }; render(); return; }
  if (b.dataset.act) act(b.dataset.act, n, b.dataset.short);
});

load();
setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
